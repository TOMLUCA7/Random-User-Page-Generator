<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Cards container -->
    <div class="cards-container">
        <!-- First card: User basic info -->
        <div id="user-card" class="card">
            <h1 id="user-name" class="name">Name</h1>
            <img id="user-picture" class="picture" src="picture.jpg" alt="Picture">
            <p id="about-me" class="about-me">About Me</p>
        </div>

        <!-- Second card: Favorites and friends -->
        <div id="details-card" class="card">
            <div class="detail-section">
                <h3 class="section-title">Favorite Quote</h3>
                <p id="favorite-quote" class="favorite-quote">Loading quote...</p>
            </div>
            
            <div class="detail-section">
                <h3 class="section-title">Favorite Pokemon</h3>
                <img id="pokemon-picture" class="pokemon-picture" src="pokemon.jpg" alt="Pokemon">
                <p id="pokemon-name" class="pokemon-name">Pokemon Name</p>
            </div>
            
            <div class="detail-section">
                <h3 class="section-title">Friends</h3>
                <p id="show-friends" class="show-friends">Loading friends...</p>
            </div>
        </div>
    </div>

    <!-- buttone to display another user -->
     <div id="button-container" class="button-container">
        <button id="generate-user-btn" class="generate-user-button">Generate User</button>
        <button id="save-user-btn" class="generate-user-button">Save User Page</button>
        <select id="saved-users-select" class="generate-user-button">
            <option value="" disabled selected>Select a user</option>
        </select>
        <button id="load-user-btn" class="generate-user-button">Load User Page</button>
    </div>
     <script type="module" src="./js/app.js"></script>
</body>
</html>

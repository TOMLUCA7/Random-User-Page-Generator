<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- a card with a name, picture, favorite quote, pokemon picture, about me and show frinds -->
    <div id="user-card" class="card">
        <h1 id="user-name" class="name">Name</h1>
        <img id="user-picture" class="picture" src="picture.jpg" alt="Picture">
        <p id="favorite-quote" class="favorite-quote">Favorite Quote</p>
        <img id="pokemon-picture" src="pokemon.jpg" alt="Pokemon">
        <p id="about-me" class="about-me">About Me</p>
        <p id="show-friends" class="show-friends">Show Friends</p>
    </div>

    <!-- buttone to display another user -->
     <div id="button-container" class="button-container">
        <button id="generate-user-btn" class="generate-user-button">Generate User</button>
    </div>
     <script type="module" src="./js/app.js"></script>
</body>
</html>
